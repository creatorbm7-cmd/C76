name: Extract app
on:
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f c7app.tar.gz ]; then
            tar xzf c7app.tar.gz
            rm -f c7app.tar.gz c7-commits.mbox
            git config user.name gh
            git config user.email gh@users.noreply.github.com
            git add -A && git commit -m "Extract app"
            git pull --rebase origin main
            git push
          fi
