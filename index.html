        var h = window.location.hash;

          window.history.replaceState(null, '', target);
        }
      })();

    <script>
      // Boot watchdog — recovers a blank screen when the JS bundle itself fails to
      // load/execute (e.g. a stale service worker serving a cached index that points
      // at chunk hashes a newer deploy removed). In that case main.tsx never runs, so
      // its own chunk-error self-heal never registers — this inline script always
      // runs and is the only thing that can recover. If #root is still empty after a
      // grace period, purge the SW + caches and hard-reload ONCE (sessionStorage-
      // guarded so a genuinely-down origin can't cause a reload loop). Clears the
      // guard once the app mounts, so a future incident can self-heal again.
      (function () {
        var KEY = '__c7_boot_recover__';
        var GRACE_MS = 8000;
        function mounted() {
          var r = document.getElementById('root');
          return !!(r && r.childElementCount > 0);
        }
        function clearGuard() { try { sessionStorage.removeItem(KEY); } catch (e) {} }
        // Once the app has mounted, drop the guard so later incidents can recover.
        window.addEventListener('load', function () {
          setTimeout(function () { if (mounted()) clearGuard(); }, GRACE_MS + 2000);
        });
        setTimeout(function () {
          if (mounted()) { clearGuard(); return; }
          var already = null;
          try { already = sessionStorage.getItem(KEY); } catch (e) {}
          if (already) return;                       // already tried once — never loop
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          var done = false;
          function reloadOnce() { if (done) return; done = true; window.location.reload(); }
          var tasks = [];
          try {
            if ('serviceWorker' in navigator) {
              tasks.push(navigator.serviceWorker.getRegistrations()
                .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
                .catch(function () {}));
            }
            if (typeof caches !== 'undefined') {
              tasks.push(caches.keys()
                .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
                .catch(function () {}));
            }
          } catch (e) {}
          Promise.all(tasks).then(reloadOnce).catch(reloadOnce);
          setTimeout(reloadOnce, 1500);              // backstop if cleanup hangs
        }, GRACE_MS);
      })();
